<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microbe Life</title>
<style>
  :root { --track-color: #7fd88f; --bg: #0a0a0a; --fg: #d8dcd4; --dim: #7a807a; --line: #1e2420; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 11px/1.3 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px 4px; }
  header b { color: var(--track-color); font-size: 12px; letter-spacing: 0.02em; }
  header .genome-name { color: var(--dim); }
  canvas { flex: 1; min-height: 120px; width: 100%; display: block; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .sliders { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 12px; padding: 6px 10px 8px; }
  label { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 6px; }
  label span { color: var(--dim); }
  output { font-variant-numeric: tabular-nums; color: var(--fg); }
  input[type=range] { grid-column: 1 / 3; width: 100%; margin: 0; height: 14px; accent-color: var(--track-color); }
</style>
</head>
<body>
<header><b>Microbe Life</b><span class="genome-name"></span></header>
<canvas aria-label="The creature the sound is made from"></canvas>
<div class="sliders"></div>
<script>/*UI*/</script>
</body>
</html>
